databaseChangeLog:
  - changeSet:
      id: 1
      author: Szilard
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: symbol
      changes:
        - createTable:
            tableName: symbol
            columns:
              - column:
                  name: code
                  type: VARCHAR
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR
              - column:
                  name: status
                  type: BOOLEAN
                  constraints:
                    nullable: false