databaseChangeLog:
  - changeSet:
      id: 8
      author: Szilard
      changes:
        - createTable:
            tableName: time_series_daily_updates
            columns:
              - column:
                  name: symbol_code
                  type: VARCHAR
                  constraints:
                    foreignKeyName: fk_time_series_daily_updates_symbol_code
                    references: symbol(code)
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false